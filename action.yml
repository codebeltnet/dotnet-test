name: .NET Test from Codebelt
description: An opinionated action that utilizes the test runner in the .NET SDK.
inputs:
  projects:
    description: Optional path to the project(s) file to test. Supports globbing. Default is an empty string.
    required: true
    default: ''
  configuration:
    description: Defines the build configuration. Default is Release (to reduce risk of surprises when transitioning to Production).
    required: true
    default: 'Release'
  verbosity-level:
    description: Sets the verbosity level of the command. Allowed values are q[uiet], m[inimal], n[ormal], d[etailed], and diag[nostic]. The default is quiet.
    required: true
    default: 'quiet'
  test-results-folder-name:
    description: The name of the folder where the test results will be written. Default is TestResults.
    required: false
    default: 'TestResults'
  build-switches:
    description: Provides a way to fully customize the build. Default is emopty. See https://learn.microsoft.com/en-us/visualstudio/msbuild/msbuild-command-line-reference?view=vs-2022#switches for more information.
    required: false
    default: ''
  blame-hang-timeout:
    description: The time to wait for a test to complete before collecting a dump. Default is 10 minutes.
    required: false
    default: '10m'
  blame-hang-dump-type:
    description: The type of dump to collect when a test hangs. Default is mini.
    required: false
    default: 'mini'
  build:
    description: Whether to build the project(s) before testing. Default is false.
    required: false
    default: 'false'
  restore:
    description: Whether to restore the project(s) before testing. Default is false.
    required: false
    default: 'false'
  test-arguments:
    description: Additional arguments to pass to the test runner. Default is empty.
    required: false
    default: ''
outputs:
  runner:
    description: The test runner selected from the repository root global.json.
    value: ${{ steps.detect-mtp.outputs.use-mtp == 'true' && 'mtp' || 'vstest' }}
  coverage-expected:
    description: Whether this run included a target framework expected to produce coverage.
    value: ${{ steps.detect-mtp.outputs.use-mtp == 'true' && steps.test-mtp.outputs.coverage-expected || steps.test-vstest.outputs.coverage-expected }}
runs:
  using: composite
  steps:
    - name: Detect Microsoft.Testing.Platform dotnet test experience
      id: detect-mtp
      shell: pwsh
      run: |
        $globalJsonPath = Join-Path $env:GITHUB_WORKSPACE 'global.json'
        $useMtp = $false

        if (Test-Path -LiteralPath $globalJsonPath -PathType Leaf) {
          try {
            $globalJson = Get-Content -LiteralPath $globalJsonPath -Raw | ConvertFrom-Json
            $useMtp = $globalJson.test.runner -eq 'Microsoft.Testing.Platform'
          }
          catch {
            throw "Could not inspect '$globalJsonPath' for the test runner: $_"
          }
        }

        "use-mtp=$($useMtp.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        Write-Host "Microsoft.Testing.Platform dotnet test experience enabled: $useMtp"

    - name: Test
      if: steps.detect-mtp.outputs.use-mtp != 'true'
      id: test-vstest
      run: |
        echo "coverage-expected=true" >> "$GITHUB_OUTPUT"
        build_restore_args=""
        if [[ "${{ inputs.restore }}" == "false" ]]; then
          build_restore_args="$build_restore_args --no-restore"
        fi
        if [[ "${{ inputs.build }}" == "false" ]]; then
          build_restore_args="$build_restore_args --no-build"
        fi
        build_restore_args="${build_restore_args#" "}" # Trim leading space

        echo "Using build/restore args: $build_restore_args"

        if [ "${{ inputs.projects }}" == "" ]; then
            dotnet test $build_restore_args --configuration ${{ inputs.configuration }} --verbosity ${{ inputs.verbosity-level }} --logger trx --results-directory $RUNNER_TEMP/${{ inputs.test-results-folder-name }} --collect:"XPlat Code Coverage;Format=opencover" --blame-hang-timeout ${{ inputs.blame-hang-timeout }} --blame-hang-dump-type ${{ inputs.blame-hang-dump-type }} -p:CoverletOutputFormat=opencover -p:UseSourceLink=true  ${{ inputs.build-switches }} ${{ inputs.test-arguments }}
        else
            shopt -s globstar extglob 2>/dev/null || true
            for file in ${{ inputs.projects }}; do
              dotnet test $file $build_restore_args --configuration ${{ inputs.configuration }} --verbosity ${{ inputs.verbosity-level }} --logger trx --results-directory $RUNNER_TEMP/${{ inputs.test-results-folder-name }} --collect:"XPlat Code Coverage;Format=opencover" --blame-hang-timeout ${{ inputs.blame-hang-timeout }} --blame-hang-dump-type ${{ inputs.blame-hang-dump-type }} -p:CoverletOutputFormat=opencover -p:UseSourceLink=true ${{ inputs.build-switches }} ${{ inputs.test-arguments }}
              echo "Tested and written results for '$file'"
            done
        fi
      shell: bash
    - name: Test with Microsoft.Testing.Platform
      id: test-mtp
      if: steps.detect-mtp.outputs.use-mtp == 'true'
      shell: bash
      run: |
        set -euo pipefail

        results_directory="$RUNNER_TEMP/${{ inputs.test-results-folder-name }}"
        mkdir -p "$results_directory"

        build_restore_args=""
        if [[ "${{ inputs.restore }}" == "false" ]]; then
          build_restore_args="$build_restore_args --no-restore"
        fi
        if [[ "${{ inputs.build }}" == "false" ]]; then
          build_restore_args="$build_restore_args --no-build"
        fi
        build_restore_args="${build_restore_args#" "}"

        echo "Using build/restore args: $build_restore_args"

        is_mtp_coverage_supported_tfm() {
          local target_framework="$1"
          if [[ "$target_framework" == "net48" ]]; then
            return 0
          fi
          [[ "$target_framework" =~ ^net([0-9]+)\.[0-9]+(-.*)?$ ]] && (( BASH_REMATCH[1] >= 8 ))
        }

        if [ "${{ inputs.projects }}" == "" ]; then
            echo "Using already-built Microsoft.Testing.Platform test modules. Build, restore, and build-switches are not applied in this module-discovery path."
            # Apple ships Bash 3.2, which does not support globstar. Use find
            # to discover modules and give each one its own results directory
            # so Coverlet versions with fixed filenames cannot overwrite output.
            modern_module=$(find . -type f -path "*/bin/${{ inputs.configuration }}/net*.0/*Tests.dll" -print -quit)
            net48_module=$(find . -type f -path "*/bin/${{ inputs.configuration }}/net48/*Tests.exe" -print -quit)
            other_framework_module=$(find . -type f -path "*/bin/${{ inputs.configuration }}/net4*/*Tests.exe" ! -path "*/bin/${{ inputs.configuration }}/net48/*" -print -quit)
            found_modules=false
            coverage_expected=false

            if [ -n "$net48_module" ]; then
              coverage_expected=true
            fi
            while IFS= read -r -d '' module; do
              module_framework=$(basename "$(dirname "$module")")
              if is_mtp_coverage_supported_tfm "$module_framework"; then
                coverage_expected=true
              fi
            done < <(find . -type f -path "*/bin/${{ inputs.configuration }}/net*.0/*Tests.dll" -print0)

            echo "coverage-expected=$coverage_expected" >> "$GITHUB_OUTPUT"

            if [ -n "$modern_module" ]; then
              found_modules=true
              echo "Running pre-built .NET test modules; Coverlet OpenCover is enabled for supported targets."
              while IFS= read -r -d '' module; do
                module_framework=$(basename "$(dirname "$module")")
                module_name=$(basename "$module" .dll)
                module_results_directory="$results_directory/$module_framework/$module_name"
                mkdir -p "$module_results_directory"
                if is_mtp_coverage_supported_tfm "$module_framework"; then
                  echo "Testing '$module' with Coverlet OpenCover coverage in '$module_results_directory'."
                  dotnet test --test-modules "$module" --max-parallel-test-modules 1 --verbosity ${{ inputs.verbosity-level }} --results-directory "$module_results_directory" -- --report-xunit-trx --coverlet --coverlet-output-format opencover --hangdump --hangdump-timeout ${{ inputs.blame-hang-timeout }} --hangdump-type ${{ inputs.blame-hang-dump-type }} ${{ inputs.test-arguments }}
                else
                  echo "Testing '$module' without Coverlet coverage in '$module_results_directory'."
                  dotnet test --test-modules "$module" --max-parallel-test-modules 1 --verbosity ${{ inputs.verbosity-level }} --results-directory "$module_results_directory" -- --report-xunit-trx --hangdump --hangdump-timeout ${{ inputs.blame-hang-timeout }} --hangdump-type ${{ inputs.blame-hang-dump-type }} ${{ inputs.test-arguments }}
                fi
              done < <(find . -type f -path "*/bin/${{ inputs.configuration }}/net*.0/*Tests.dll" -print0)
            fi

            if [ -n "$net48_module" ]; then
              found_modules=true
              echo "Running net48 test modules with Coverlet OpenCover coverage."
              while IFS= read -r -d '' module; do
                module_name=$(basename "$module" .exe)
                module_results_directory="$results_directory/net48/$module_name"
                mkdir -p "$module_results_directory"
                echo "Testing '$module' with results in '$module_results_directory'."
                dotnet test --test-modules "$module" --max-parallel-test-modules 1 --verbosity ${{ inputs.verbosity-level }} --results-directory "$module_results_directory" -- --report-xunit-trx --coverlet --coverlet-output-format opencover --hangdump --hangdump-timeout ${{ inputs.blame-hang-timeout }} --hangdump-type-if-supported ${{ inputs.blame-hang-dump-type }} ${{ inputs.test-arguments }}
              done < <(find . -type f -path "*/bin/${{ inputs.configuration }}/net48/*Tests.exe" -print0)
            fi

            if [ -n "$other_framework_module" ]; then
              found_modules=true
              echo "Running other .NET Framework test modules without Coverlet coverage."
              while IFS= read -r -d '' module; do
                module_framework=$(basename "$(dirname "$module")")
                module_name=$(basename "$module" .exe)
                module_results_directory="$results_directory/$module_framework/$module_name"
                mkdir -p "$module_results_directory"
                echo "Testing '$module' without Coverlet coverage."
                dotnet test --test-modules "$module" --max-parallel-test-modules 1 --verbosity ${{ inputs.verbosity-level }} --results-directory "$module_results_directory" -- --report-xunit-trx --hangdump --hangdump-timeout ${{ inputs.blame-hang-timeout }} --hangdump-type-if-supported ${{ inputs.blame-hang-dump-type }} ${{ inputs.test-arguments }}
              done < <(find . -type f -path "*/bin/${{ inputs.configuration }}/net4*/*Tests.exe" ! -path "*/bin/${{ inputs.configuration }}/net48/*" -print0)
            fi

            if [ "$found_modules" != true ]; then
              echo "::error::No built test modules were found for the Microsoft.Testing.Platform run."
              exit 1
            fi
        else
            project_files=()
            project_frameworks=()
            coverage_expected=false

            for file in ${{ inputs.projects }}; do
              target_frameworks=$(dotnet msbuild "$file" -getProperty:TargetFrameworks -p:Configuration=${{ inputs.configuration }} ${{ inputs.build-switches }})
              if [ -z "$target_frameworks" ]; then
                target_frameworks=$(dotnet msbuild "$file" -getProperty:TargetFramework -p:Configuration=${{ inputs.configuration }} ${{ inputs.build-switches }})
              fi

              if [ -z "$target_frameworks" ]; then
                echo "::error::Could not determine target frameworks for '$file'."
                exit 1
              fi

              echo "Project '$file' target frameworks: $target_frameworks"
              IFS=';' read -r -a target_framework_list <<< "$target_frameworks"
              for target_framework in "${target_framework_list[@]}"; do
                if [ -z "$target_framework" ]; then
                  continue
                fi

                project_files+=("$file")
                project_frameworks+=("$target_framework")
                if is_mtp_coverage_supported_tfm "$target_framework"; then
                  coverage_expected=true
                fi
              done
            done

            echo "coverage-expected=$coverage_expected" >> "$GITHUB_OUTPUT"

            project_index=0
            while [ "$project_index" -lt "${#project_files[@]}" ]; do
              file="${project_files[$project_index]}"
              target_framework="${project_frameworks[$project_index]}"
              project_name=$(basename "$file" .csproj)
              project_results_directory="$results_directory/$target_framework/$project_name"
              hangdump_type_option="--hangdump-type"
              if [[ "$target_framework" == net4* ]]; then
                hangdump_type_option="--hangdump-type-if-supported"
              fi
              mkdir -p "$project_results_directory"

              if is_mtp_coverage_supported_tfm "$target_framework"; then
                echo "Testing '$file' for '$target_framework' with Coverlet OpenCover coverage."
                dotnet test --project "$file" --framework "$target_framework" $build_restore_args --configuration ${{ inputs.configuration }} --verbosity ${{ inputs.verbosity-level }} --results-directory "$project_results_directory" -p:UseSourceLink=true ${{ inputs.build-switches }} -- --report-xunit-trx --coverlet --coverlet-output-format opencover --hangdump --hangdump-timeout ${{ inputs.blame-hang-timeout }} $hangdump_type_option ${{ inputs.blame-hang-dump-type }} ${{ inputs.test-arguments }}
              else
                echo "Testing '$file' for '$target_framework' without Coverlet coverage."
                dotnet test --project "$file" --framework "$target_framework" $build_restore_args --configuration ${{ inputs.configuration }} --verbosity ${{ inputs.verbosity-level }} --results-directory "$project_results_directory" -p:UseSourceLink=true ${{ inputs.build-switches }} -- --report-xunit-trx --hangdump --hangdump-timeout ${{ inputs.blame-hang-timeout }} $hangdump_type_option ${{ inputs.blame-hang-dump-type }} ${{ inputs.test-arguments }}
              fi

              echo "Tested and written results for '$file' ($target_framework)"
              project_index=$((project_index + 1))
            done
        fi
branding:
  icon: 'umbrella'
  color: 'blue'
